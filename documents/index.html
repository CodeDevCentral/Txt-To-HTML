<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
<meta charset="UTF-8">
<title>Secure Document Viewer</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- KaTeX for realistic client-side display of server-processed LaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"> 
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script> 

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      
<link rel="stylesheet" href="/theme.css">
<script defer src="/app.js"></script>

</head> 

<body> 

    <div id="browserViewport" class="flex-1 bg-white overflow-y-auto p-8 protected-content relative">
        <div id="renderOutput" class= "max-w-3xl mx-auto space-y-6 text-slate-900">
            <div class="corp-container">
          <!-- Server side rendered html content will be injected here -->
          {{CONTENT}}
            </div>
        </div>
    </div>
    
</body> 

</html>
